# GitHub Actions CI — reference copy.
#
# CI is ACTIVE at .github/workflows/ci.yml (it runs the regression suites,
# the hint-quality acceptance gates from scripts/rescue-gates.mjs, the
# persona-efficacy probe, lint and the store package). This file is kept as
# the readable reference and as the template to restore from; edit both, or
# edit this one and copy it over:
#   cp docs/ci-workflow.example.yml .github/workflows/ci.yml

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests (bare Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The ten suites are self-contained (plain node:test-free assert
      # scripts) — no install step needed.
      - run: node scripts/run-tests.mjs

  lint:
    name: Lint & format tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      # Prettier is available for a deliberate `npm run format` pass but is
      # not gated yet: a whole-tree reformat belongs in its own commit.
      - run: npx prettier --version

  package:
    name: Store zip builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chess-hint-assistant-zip
          path: dist/*.zip
